# Configuración de herramientas del backend. Las dependencias están en requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: estilo · F: errores · I: imports · B: bugs comunes · UP: sintaxis moderna
# SIM: simplificaciones · RUF: reglas propias de ruff
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
