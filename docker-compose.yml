name: valdelumbre

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Puerto del ordenador: API_PORT=8001 docker compose up --build si el 8000 está ocupado.
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    # Ídem con WEB_PORT para la pantalla. nginx habla con la API por la red interna (api:8000).
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
