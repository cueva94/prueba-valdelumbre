server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve en el mismo origen que la pantalla: sin CORS.
    # La barra final de proxy_pass quita el prefijo: /api/pois -> http://api:8000/pois
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Las traducciones no llevan hash en el nombre: se revalidan siempre para no servir unas antiguas.
    location /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
